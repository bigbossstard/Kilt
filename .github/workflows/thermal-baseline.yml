name: Thermal historical baseline build

on:
  push:
    branches:
      - "baseline/thermal-1.20.1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thermal-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kilt 1.20.1 baseline
        run: ./gradlew --no-daemon --max-workers=2 remapJar --stacktrace

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilt-1.20.1-baseline
          path: build/libs/Kilt-*.jar
          if-no-files-found: ignore
