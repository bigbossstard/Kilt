name: Kilt bridge build

on:
  push:
    branches:
      - "work/**"
      - "baseline/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kilt
        run: ./gradlew --no-daemon --max-workers=2 test remapJar --stacktrace

      - name: Upload Kilt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilt-bridge-build
          path: build/libs/Kilt-*.jar
          if-no-files-found: ignore
